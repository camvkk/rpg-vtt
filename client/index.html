<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RPG Virtual Tabletop - Dark Fantasy Edition. Zero cadastro, real-time multiplayer, baseado em D&D 5e." />
    <title>RPG VTT - Virtual Tabletop Dark Fantasy</title>
    <style>
      /* Loading styles to prevent flash */
      #root {
        background: #0f0f1a;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      
      /* Loading spinner for initial load */
      .initial-loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #e2b714;
        font-family: 'Inter', sans-serif;
        text-align: center;
        z-index: 9999;
      }
      
      .initial-loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(226, 183, 20, 0.3);
        border-top: 3px solid #e2b714;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state -->
      <div class="initial-loading">
        <div class="spinner"></div>
        <div>Carregando RPG VTT...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
