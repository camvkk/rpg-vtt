<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4a3728" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="wood" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#5c3d2e"/>
      <line x1="0" y1="5" x2="20" y2="5" stroke="#4a3020" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="15" x2="20" y2="15" stroke="#6b4a38" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <pattern id="stone" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#3a3a3a"/>
      <rect x="1" y="1" width="6" height="6" fill="#424242" rx="1"/>
      <rect x="9" y="9" width="6" height="6" fill="#383838" rx="1"/>
      <rect x="9" y="1" width="6" height="6" fill="#404040" rx="1"/>
      <rect x="1" y="9" width="6" height="6" fill="#3c3c3c" rx="1"/>
    </pattern>
  </defs>
  
  <!-- Background (outside) -->
  <rect width="1120" height="800" fill="#1a1a1a"/>
  
  <!-- Main Hall Floor -->
  <rect x="120" y="80" width="560" height="480" fill="url(#wood)" rx="4"/>
  
  <!-- Kitchen -->
  <rect x="720" y="80" width="280" height="240" fill="url(#stone)" rx="4"/>
  
  <!-- Storage Room -->
  <rect x="720" y="360" width="280" height="200" fill="url(#stone)" rx="4"/>
  
  <!-- Bar Area -->
  <rect x="520" y="120" width="120" height="200" fill="#4a2f1e" rx="4"/>
  <rect x="530" y="130" width="100" height="180" fill="#3a2518" rx="2"/>
  <!-- Bar stools -->
  <circle cx="510" cy="160" r="8" fill="#6b4a38" stroke="#3a2518" stroke-width="1"/>
  <circle cx="510" cy="200" r="8" fill="#6b4a38" stroke="#3a2518" stroke-width="1"/>
  <circle cx="510" cy="240" r="8" fill="#6b4a38" stroke="#3a2518" stroke-width="1"/>
  <circle cx="510" cy="280" r="8" fill="#6b4a38" stroke="#3a2518" stroke-width="1"/>
  
  <!-- Tables -->
  <!-- Table 1 -->
  <rect x="180" y="160" width="80" height="60" fill="#6b4a38" stroke="#3a2518" stroke-width="2" rx="4"/>
  <circle cx="170" cy="175" r="7" fill="#5c3d2e"/>
  <circle cx="170" cy="205" r="7" fill="#5c3d2e"/>
  <circle cx="270" cy="175" r="7" fill="#5c3d2e"/>
  <circle cx="270" cy="205" r="7" fill="#5c3d2e"/>
  
  <!-- Table 2 -->
  <rect x="180" y="320" width="80" height="60" fill="#6b4a38" stroke="#3a2518" stroke-width="2" rx="4"/>
  <circle cx="170" cy="335" r="7" fill="#5c3d2e"/>
  <circle cx="170" cy="365" r="7" fill="#5c3d2e"/>
  <circle cx="270" cy="335" r="7" fill="#5c3d2e"/>
  <circle cx="270" cy="365" r="7" fill="#5c3d2e"/>
  
  <!-- Table 3 (round) -->
  <circle cx="380" cy="240" r="35" fill="#6b4a38" stroke="#3a2518" stroke-width="2"/>
  <circle cx="340" cy="215" r="7" fill="#5c3d2e"/>
  <circle cx="420" cy="215" r="7" fill="#5c3d2e"/>
  <circle cx="340" cy="265" r="7" fill="#5c3d2e"/>
  <circle cx="420" cy="265" r="7" fill="#5c3d2e"/>
  
  <!-- Table 4 -->
  <rect x="180" y="440" width="120" height="60" fill="#6b4a38" stroke="#3a2518" stroke-width="2" rx="4"/>
  <circle cx="200" cy="430" r="7" fill="#5c3d2e"/>
  <circle cx="240" cy="430" r="7" fill="#5c3d2e"/>
  <circle cx="280" cy="430" r="7" fill="#5c3d2e"/>
  <circle cx="200" cy="510" r="7" fill="#5c3d2e"/>
  <circle cx="240" cy="510" r="7" fill="#5c3d2e"/>
  <circle cx="280" cy="510" r="7" fill="#5c3d2e"/>
  
  <!-- Fireplace -->
  <rect x="130" y="100" width="20" height="60" fill="#8b4513"/>
  <rect x="132" y="110" width="16" height="40" fill="#ff6b35" opacity="0.7"/>
  <rect x="134" y="115" width="12" height="30" fill="#ff4500" opacity="0.5"/>
  
  <!-- Stage/Performance area -->
  <rect x="360" y="400" width="160" height="120" fill="#7a5230" stroke="#5c3d2e" stroke-width="2" rx="4"/>
  <text x="440" y="465" text-anchor="middle" fill="#c9a96e" font-size="12" font-family="serif">Palco</text>
  
  <!-- Kitchen furniture -->
  <rect x="740" y="100" width="80" height="40" fill="#555" stroke="#333" stroke-width="2" rx="2"/>
  <text x="780" y="125" text-anchor="middle" fill="#999" font-size="10">Fogão</text>
  <rect x="740" y="160" width="60" height="40" fill="#555" stroke="#333" stroke-width="2" rx="2"/>
  <rect x="860" y="100" width="40" height="80" fill="#664" stroke="#443" stroke-width="2" rx="2"/>
  <rect x="920" y="100" width="60" height="60" fill="#445" stroke="#334" stroke-width="2" rx="2"/>
  
  <!-- Storage barrels -->
  <circle cx="760" cy="400" r="15" fill="#7a5230" stroke="#5c3d2e" stroke-width="2"/>
  <circle cx="800" cy="400" r="15" fill="#7a5230" stroke="#5c3d2e" stroke-width="2"/>
  <circle cx="760" cy="440" r="15" fill="#7a5230" stroke="#5c3d2e" stroke-width="2"/>
  <circle cx="800" cy="440" r="15" fill="#7a5230" stroke="#5c3d2e" stroke-width="2"/>
  <circle cx="760" cy="480" r="15" fill="#7a5230" stroke="#5c3d2e" stroke-width="2"/>
  <!-- Crates -->
  <rect x="860" y="380" width="30" height="30" fill="#6b5230" stroke="#4a3728" stroke-width="1" rx="2"/>
  <rect x="900" y="380" width="30" height="30" fill="#6b5230" stroke="#4a3728" stroke-width="1" rx="2"/>
  <rect x="860" y="420" width="30" height="30" fill="#6b5230" stroke="#4a3728" stroke-width="1" rx="2"/>
  <rect x="900" y="420" width="30" height="30" fill="#6b5230" stroke="#4a3728" stroke-width="1" rx="2"/>
  
  <!-- Walls -->
  <rect x="116" y="76" width="568" height="8" fill="#2a1f14"/>
  <rect x="116" y="76" width="8" height="488" fill="#2a1f14"/>
  <rect x="116" y="556" width="568" height="8" fill="#2a1f14"/>
  <rect x="676" y="76" width="8" height="488" fill="#2a1f14"/>
  
  <!-- Kitchen walls -->
  <rect x="716" y="76" width="288" height="8" fill="#2a1f14"/>
  <rect x="716" y="76" width="8" height="248" fill="#2a1f14"/>
  <rect x="996" y="76" width="8" height="488" fill="#2a1f14"/>
  <rect x="716" y="316" width="288" height="8" fill="#2a1f14"/>
  
  <!-- Storage walls -->
  <rect x="716" y="356" width="288" height="8" fill="#2a1f14"/>
  <rect x="716" y="356" width="8" height="208" fill="#2a1f14"/>
  <rect x="716" y="556" width="288" height="8" fill="#2a1f14"/>
  
  <!-- Doors -->
  <!-- Main entrance -->
  <rect x="350" y="556" width="80" height="8" fill="#8b6914"/>
  <text x="390" y="585" text-anchor="middle" fill="#c9a96e" font-size="11" font-family="serif">Entrada</text>
  <!-- Kitchen door -->
  <rect x="676" y="160" width="8" height="60" fill="#8b6914"/>
  <!-- Storage door -->
  <rect x="676" y="400" width="8" height="60" fill="#8b6914"/>
  <!-- Back door -->
  <rect x="880" y="556" width="60" height="8" fill="#8b6914"/>
  <text x="910" y="585" text-anchor="middle" fill="#c9a96e" font-size="11" font-family="serif">Fundos</text>
  
  <!-- Stairs up -->
  <rect x="580" y="440" width="80" height="100" fill="#4a3020"/>
  <line x1="580" y1="460" x2="660" y2="460" stroke="#5c3d2e" stroke-width="1"/>
  <line x1="580" y1="480" x2="660" y2="480" stroke="#5c3d2e" stroke-width="1"/>
  <line x1="580" y1="500" x2="660" y2="500" stroke="#5c3d2e" stroke-width="1"/>
  <line x1="580" y1="520" x2="660" y2="520" stroke="#5c3d2e" stroke-width="1"/>
  <text x="620" y="455" text-anchor="middle" fill="#c9a96e" font-size="10" font-family="serif">↑ Andar Superior</text>
  
  <!-- Grid overlay -->
  <rect width="1120" height="800" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#c9a96e" font-size="20" font-family="serif" font-weight="bold">A Taverna do Javali Dourado</text>
</svg>
